name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/french-anki-app-0ucuok
  workflow_dispatch:

# GITHUB_TOKEN'a Pages'e deploy izni ver
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy çalışsın; sıradaki push öncekini beklemesin
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Build adımı yok: depo kökü olduğu gibi yayınlanıyor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
